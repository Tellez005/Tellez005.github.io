<!DOCTYPE html>
<html>
<head>
    <title>Opinion</title>
</head>
<body>
    <h2>opinion:</h2>
    <div id="opinion"></div>
    <script>
        fetch('/api/opinion')
            .then(res => res.json())
            .then(data => {
                const contenedor = document.getElementById('opinion');

                data.forEach(opinion => {
                    const p = document.createElement('p');
                    p.textContent = opinion.Opinion;
                    contenedor.appendChild(p);
                });
            })
            .catch(error => console.log(error));
    </script>
</body>
</html>
