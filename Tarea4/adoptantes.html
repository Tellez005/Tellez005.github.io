<!DOCTYPE html>
<html>
<head>
    <title>Adoptantes</title>
</head>
<body>
    <h2>Adoptadores:</h2>
    <div id="adoptantes"></div>
    <script>
        fetch('/api/adoptantes')
            .then(res => res.json())
            .then(data => {
                const contenedor = document.getElementById('adoptantes');

                data.forEach(adoptantes => {
                    const p = document.createElement('p');
                    p.textContent = adoptantes.Nombre+ ' - ' + adoptantes.localidad;
                    contenedor.appendChild(p);
                });
            })
            .catch(error => console.log(error));
    </script>
</body>
</html>
